# GPT-5.6 Sol robustness judge for analysis/run_cross_judge_audit.py.
# This judge-only config is not accepted by the tutor/student runner.
# Transport: OpenRouter, pinned by the runner to the openai upstream without fallback.
# See cross-judge-amendment-openrouter-2026-07-20.md for the dated transport decision
# and supplement/second-judge-transport-disclosure.md for current interpretation.
# The returned model slug does not identify an immutable upstream deployment.
# reasoning_effort is requested; upstream enforcement was not established.
# A routing or model change requires a new amendment and live preflight.

provider: openrouter
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

roles:
  judge:
    provider: openrouter
    model: openai/gpt-5.6-sol   # router slug; response.model is checked against preflight
    temperature: null           # OMITTED from the request (model's default sampling)
    max_tokens: 2048            # sent as max_completion_tokens
    reasoning_effort: medium    # explicit; top-level Chat Completions field

backend: live
