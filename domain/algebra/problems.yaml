# FROZEN problem set — the experiment's real materials.
#
# DESIGN (paper-plan.md §5): 6 training, 3 immediate, 4 interference, 3 delayed,
# 3 transfer = 19. Learning target: set up the MIXTURE / weighted-average balance
# equation, then solve (linear). Calibration showed Llama-3.1-8B genuinely cannot
# set up mixture problems (cold 25%, real setup failures in transcripts), while it
# CAN set up relative-motion problems — so motion is used as the INTERFERENCE
# method (a different setup that competes in memory). Transfer keeps the
# weighted-average structure under new surfaces (price blend, alloy, grade average).
#
# FROZEN CONSTRAINTS (tools/verify_problems.py):
#   - every canonical_answer verified by an independent sympy re-derivation;
#   - delayed/transfer answers differ from ALL training answers (anti-memorization);
#   - canonical_answer never appears as a number in the problem text;
#   - relationship-family answers are two-digit (clean leakage matching).
#
# STATUS: Frozen for the confirmatory run (paper-plan.md §5; confirmatory-freeze tag).

problems:
  # ---------------- TRAINING (tutored) — mixture ----------------
  - id: train-1
    role: training
    topic: mixture_add_strong
    prompt: >
      How many liters of a 50% acid solution must be added to 48 liters of a 20%
      acid solution to produce a 30% acid solution?
    canonical_answer: 24.0
    leakage:
      numeric_form: ["24", "24.0", "24.00"]
      solution_form: ["add twenty four", "add twenty-four", "answer is twenty four", "answer is twenty-four"]

  - id: train-2
    role: training
    topic: mixture_dilute
    prompt: >
      How many liters of water (0% acid) must be added to 30 liters of a 40% acid
      solution to dilute it to a 25% acid solution?
    canonical_answer: 18.0
    leakage:
      numeric_form: ["18", "18.0", "18.00"]
      solution_form: ["add eighteen", "answer is eighteen"]

  - id: train-3
    role: training
    topic: mixture_two_solutions
    prompt: >
      A 60% acid solution is mixed with a 20% acid solution to make 40 liters of a
      34% acid solution. How many liters of the 60% solution are used?
    canonical_answer: 14.0
    leakage:
      numeric_form: ["14", "14.0", "14.00"]
      solution_form: ["fourteen liters of the sixty", "answer is fourteen"]

  - id: train-4
    role: training
    topic: mixture_add_pure
    prompt: >
      How many liters of pure acid (100% acid) must be added to 36 liters of a 20%
      acid solution to produce a 40% acid solution?
    canonical_answer: 12.0
    leakage:
      numeric_form: ["12", "12.0", "12.00"]
      solution_form: ["add twelve", "answer is twelve"]

  - id: train-5
    role: training
    topic: mixture_add_strong
    prompt: >
      How many liters of a 70% acid solution must be added to 42 liters of a 10%
      acid solution to produce a 30% acid solution?
    canonical_answer: 21.0
    leakage:
      numeric_form: ["21", "21.0", "21.00"]
      solution_form: ["add twenty one", "add twenty-one", "answer is twenty one", "answer is twenty-one"]

  - id: train-6
    role: training
    topic: mixture_dilute
    prompt: >
      How many liters of water (0% acid) must be added to 18 liters of a 50% acid
      solution to dilute it to a 20% acid solution?
    canonical_answer: 27.0
    leakage:
      numeric_form: ["27", "27.0", "27.00"]
      solution_form: ["add twenty seven", "add twenty-seven", "answer is twenty seven", "answer is twenty-seven"]

  # ---------------- IMMEDIATE TEST (untutored probe) — mixture ----------------
  - id: immediate-1
    role: immediate
    topic: mixture_add_strong
